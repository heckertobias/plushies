name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# One in-flight run per ref: pushing a new commit to a PR cancels the previous,
# still-running CI for that PR instead of piling up parallel runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26" # keep in sync with the Dockerfile base image
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Same `next build` the Docker image runs; needs no env vars or database.
      - name: Build
        run: npm run build
