name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# One in-flight run per ref: pushing a new commit to a PR cancels the previous,
# still-running CI for that PR instead of piling up parallel runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26" # keep in sync with the Dockerfile base image
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Same `next build` the Docker image runs; needs no env vars or database.
      - name: Build
        run: npm run build
